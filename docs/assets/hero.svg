<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070C16"/>
      <stop offset="55%" stop-color="#0B1526"/>
      <stop offset="100%" stop-color="#0A1A2B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E3A5F" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <ellipse cx="880" cy="140" rx="330" ry="230" fill="url(#glow)"/>
  <ellipse cx="1080" cy="300" rx="220" ry="160" fill="url(#glowAmber)"/>

  <!-- stylised operational network on the right -->
  <g stroke="#2DD4BF" stroke-opacity="0.45" fill="none" stroke-width="1.4">
    <path d="M760 250 L845 175 L940 205 L1035 140"/>
    <path d="M845 175 L865 95 L960 70"/>
    <path d="M940 205 L1000 265 L1105 240"/>
    <path d="M865 95 L1035 140"/>
  </g>
  <g>
    <circle cx="760" cy="250" r="5" fill="#22D3EE"/>
    <circle cx="845" cy="175" r="7" fill="#22D3EE"/>
    <circle cx="940" cy="205" r="5" fill="#2DD4BF"/>
    <circle cx="1035" cy="140" r="6" fill="#2DD4BF"/>
    <circle cx="865" cy="95" r="5" fill="#38BDF8"/>
    <circle cx="960" cy="70" r="4" fill="#38BDF8"/>
    <circle cx="1000" cy="265" r="4" fill="#22D3EE"/>
    <circle cx="1105" cy="240" r="5" fill="#22D3EE"/>
  </g>
  <!-- incident pulses -->
  <g>
    <circle cx="912" cy="128" r="26" fill="none" stroke="#F87171" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="912" cy="128" r="15" fill="none" stroke="#F87171" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="912" cy="128" r="6" fill="#F87171"/>
    <circle cx="1062" cy="212" r="20" fill="none" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="1062" cy="212" r="10" fill="none" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="1062" cy="212" r="5" fill="#F59E0B"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(72,84)">
    <rect x="0" y="0" width="58" height="58" rx="14" fill="#0F2A44" stroke="#22D3EE" stroke-opacity="0.55"/>
    <circle cx="29" cy="29" r="15" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="29" cy="29" r="5" fill="#22D3EE"/>
    <path d="M29 4 V12 M29 46 V54 M4 29 H12 M46 29 H54" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>

    <text x="80" y="30" font-size="52" font-weight="700" fill="#F8FAFC" letter-spacing="6">KUT</text>
    <text x="82" y="56" font-size="15" font-weight="600" fill="#22D3EE" letter-spacing="3.6">OPERATIONAL INTELLIGENCE PLATFORM</text>
  </g>

  <text x="74" y="196" font-size="18" fill="#94A3B8">Dağınık operasyonel veriyi tek bir canlı harita üzerinde birleştirir.</text>
  <text x="74" y="222" font-size="18" fill="#64748B">One live operational picture for incidents, teams, vehicles and events.</text>

  <g font-size="12.5" font-weight="600" letter-spacing="0.6">
    <g transform="translate(74,250)">
      <rect width="132" height="28" rx="14" fill="#0E2233" stroke="#1E4B63"/>
      <text x="66" y="18.5" text-anchor="middle" fill="#7DD3FC">EVENT-DRIVEN</text>
    </g>
    <g transform="translate(216,250)">
      <rect width="112" height="28" rx="14" fill="#0E2233" stroke="#1E4B63"/>
      <text x="56" y="18.5" text-anchor="middle" fill="#7DD3FC">REALTIME</text>
    </g>
    <g transform="translate(338,250)">
      <rect width="136" height="28" rx="14" fill="#0E2233" stroke="#1E4B63"/>
      <text x="68" y="18.5" text-anchor="middle" fill="#7DD3FC">GEOSPATIAL</text>
    </g>
    <g transform="translate(484,250)">
      <rect width="168" height="28" rx="14" fill="#1B1A0E" stroke="#5C4A12"/>
      <text x="84" y="18.5" text-anchor="middle" fill="#FCD34D">AI DECISION SUPPORT</text>
    </g>
  </g>

  <rect x="0" y="336" width="1200" height="4" fill="url(#sweep)"/>
</svg>
