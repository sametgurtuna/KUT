<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#070C14"/>
  <text x="40" y="46" font-size="19" font-weight="700" fill="#F1F5F9">KUT — Hedef Mimari / Target Architecture</text>
  <text x="40" y="68" font-size="12.5" fill="#64748B">Milestone 9 görünümü · dolu kutular bugün mevcut, kesikli kutular yol haritasında</text>

  <!-- legend -->
  <g transform="translate(880,36)" font-size="11">
    <rect width="14" height="10" rx="2" fill="#0F2A44" stroke="#22D3EE"/>
    <text x="22" y="9.5" fill="#94A3B8">mevcut / shipped</text>
    <rect y="18" width="14" height="10" rx="2" fill="#1A1508" stroke="#F59E0B" stroke-dasharray="3 2"/>
    <text x="22" y="27.5" fill="#94A3B8">planlanan / planned</text>
  </g>

  <!-- ===== Layer 1: clients ===== -->
  <text x="40" y="112" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#475569">İSTEMCİ / CLIENTS</text>
  <g>
    <rect x="40" y="124" width="240" height="86" rx="12" fill="#0F1B2D" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="60" y="150" font-size="14" font-weight="700" fill="#E2E8F0">KUT UI</text>
    <text x="60" y="171" font-size="11.5" fill="#94A3B8">React 19 · TypeScript · Vite</text>
    <text x="60" y="190" font-size="11.5" fill="#94A3B8">MapLibre GL JS</text>

    <rect x="300" y="124" width="200" height="86" rx="12" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.6" stroke-dasharray="5 4"/>
    <text x="320" y="150" font-size="14" font-weight="700" fill="#FCD34D">Mobil / Saha</text>
    <text x="320" y="171" font-size="11.5" fill="#A8A29E">Araç terminali</text>
    <text x="320" y="190" font-size="11.5" fill="#A8A29E">Konum yayını</text>

    <rect x="520" y="124" width="200" height="86" rx="12" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.6" stroke-dasharray="5 4"/>
    <text x="540" y="150" font-size="14" font-weight="700" fill="#FCD34D">Harici Sistemler</text>
    <text x="540" y="171" font-size="11.5" fill="#A8A29E">Kurum entegrasyonları</text>
    <text x="540" y="190" font-size="11.5" fill="#A8A29E">Webhook / REST</text>
  </g>

  <!-- ===== Layer 2: API ===== -->
  <text x="40" y="266" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#475569">UYGULAMA KATMANI / APPLICATION</text>
  <rect x="40" y="278" width="680" height="150" rx="14" fill="#0B1626" stroke="#1E293B"/>
  <text x="60" y="304" font-size="13.5" font-weight="700" fill="#E2E8F0">KUT Backend — ASP.NET Core (.NET 10)</text>

  <g>
    <rect x="60" y="318" width="150" height="46" rx="9" fill="#0F2A44" stroke="#22D3EE" stroke-opacity="0.5"/>
    <text x="135" y="339" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7DD3FC">REST API</text>
    <text x="135" y="355" text-anchor="middle" font-size="10" fill="#64748B">Swagger / OpenAPI</text>

    <rect x="222" y="318" width="150" height="46" rx="9" fill="#0F2A44" stroke="#22D3EE" stroke-opacity="0.5"/>
    <text x="297" y="339" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7DD3FC">SignalR Hub</text>
    <text x="297" y="355" text-anchor="middle" font-size="10" fill="#64748B">canlı yayın</text>

    <rect x="384" y="318" width="150" height="46" rx="9" fill="#0F2A44" stroke="#22D3EE" stroke-opacity="0.5"/>
    <text x="459" y="339" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7DD3FC">Event Store</text>
    <text x="459" y="355" text-anchor="middle" font-size="10" fill="#64748B">denetim izi</text>

    <rect x="546" y="318" width="150" height="46" rx="9" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.6" stroke-dasharray="5 4"/>
    <text x="621" y="339" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FCD34D">Karar Motoru</text>
    <text x="621" y="355" text-anchor="middle" font-size="10" fill="#78716C">en yakın/uygun araç</text>

    <rect x="60" y="374" width="222" height="40" rx="9" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.6" stroke-dasharray="5 4"/>
    <text x="171" y="399" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FCD34D">Ontoloji Servisi</text>

    <rect x="294" y="374" width="222" height="40" rx="9" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.6" stroke-dasharray="5 4"/>
    <text x="405" y="399" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FCD34D">AI Orchestrator (grounded)</text>

    <rect x="528" y="374" width="168" height="40" rx="9" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.6" stroke-dasharray="5 4"/>
    <text x="612" y="399" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FCD34D">Ingestion Workers</text>
  </g>

  <!-- ===== Layer 3: data ===== -->
  <text x="40" y="486" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#475569">VERİ KATMANI / DATA</text>
  <g>
    <rect x="40" y="498" width="200" height="104" rx="12" fill="#0F1B2D" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="60" y="524" font-size="13.5" font-weight="700" fill="#E2E8F0">PostgreSQL</text>
    <text x="60" y="545" font-size="11" fill="#94A3B8">Organizations · Teams</text>
    <text x="60" y="563" font-size="11" fill="#94A3B8">Vehicles · Incidents</text>
    <text x="60" y="581" font-size="11" fill="#94A3B8">Events (append-only)</text>
    <text x="60" y="596" font-size="10" fill="#475569">EF Core · Npgsql</text>

    <rect x="260" y="498" width="150" height="104" rx="12" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.6" stroke-dasharray="5 4"/>
    <text x="280" y="524" font-size="13" font-weight="700" fill="#FCD34D">Redis</text>
    <text x="280" y="545" font-size="11" fill="#A8A29E">canlı durum</text>
    <text x="280" y="563" font-size="11" fill="#A8A29E">önbellek</text>
    <text x="280" y="581" font-size="11" fill="#A8A29E">presence</text>

    <rect x="430" y="498" width="150" height="104" rx="12" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.6" stroke-dasharray="5 4"/>
    <text x="450" y="524" font-size="13" font-weight="700" fill="#FCD34D">Graph Store</text>
    <text x="450" y="545" font-size="11" fill="#A8A29E">varlık ilişkileri</text>
    <text x="450" y="563" font-size="11" fill="#A8A29E">ontoloji sorguları</text>

    <rect x="600" y="498" width="150" height="104" rx="12" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.6" stroke-dasharray="5 4"/>
    <text x="620" y="524" font-size="13" font-weight="700" fill="#FCD34D">Search</text>
    <text x="620" y="545" font-size="11" fill="#A8A29E">tam metin</text>
    <text x="620" y="563" font-size="11" fill="#A8A29E">coğrafi sorgu</text>
  </g>

  <!-- ===== Event bus ===== -->
  <rect x="40" y="640" width="710" height="58" rx="12" fill="#12102A" stroke="#A78BFA" stroke-opacity="0.55" stroke-dasharray="5 4"/>
  <text x="60" y="666" font-size="13.5" font-weight="700" fill="#C4B5FD">Event Bus</text>
  <text x="60" y="686" font-size="11" fill="#8B8AA8">IncidentCreated · VehicleAssigned · VehicleLocationChanged · TeamStatusChanged · …</text>
  <text x="640" y="674" font-size="10.5" fill="#8B8AA8">at-least-once</text>

  <!-- ===== Right column: ingestion sources ===== -->
  <text x="800" y="112" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#475569">VERİ KAYNAKLARI / SOURCES</text>
  <rect x="800" y="124" width="360" height="574" rx="14" fill="#0A121F" stroke="#1E293B"/>
  <g font-size="11.5">
    <g transform="translate(820,148)">
      <rect width="320" height="52" rx="10" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.5" stroke-dasharray="5 4"/>
      <text x="16" y="22" font-size="12.5" font-weight="700" fill="#FCD34D">IoT / Telemetri</text>
      <text x="16" y="40" fill="#A8A29E">araç GPS, sensör, saha cihazları</text>
    </g>
    <g transform="translate(820,212)">
      <rect width="320" height="52" rx="10" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.5" stroke-dasharray="5 4"/>
      <text x="16" y="22" font-size="12.5" font-weight="700" fill="#FCD34D">Hava Durumu</text>
      <text x="16" y="40" fill="#A8A29E">uyarılar, rüzgâr, yağış</text>
    </g>
    <g transform="translate(820,276)">
      <rect width="320" height="52" rx="10" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.5" stroke-dasharray="5 4"/>
      <text x="16" y="22" font-size="12.5" font-weight="700" fill="#FCD34D">Trafik</text>
      <text x="16" y="40" fill="#A8A29E">yoğunluk, kapalı yollar, ETA girdisi</text>
    </g>
    <g transform="translate(820,340)">
      <rect width="320" height="52" rx="10" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.5" stroke-dasharray="5 4"/>
      <text x="16" y="22" font-size="12.5" font-weight="700" fill="#FCD34D">CSV / Toplu Yükleme</text>
      <text x="16" y="40" fill="#A8A29E">kurum envanteri, geçmiş kayıtlar</text>
    </g>
    <g transform="translate(820,404)">
      <rect width="320" height="52" rx="10" fill="#1A1508" stroke="#F59E0B" stroke-opacity="0.5" stroke-dasharray="5 4"/>
      <text x="16" y="22" font-size="12.5" font-weight="700" fill="#FCD34D">Harici REST API'ler</text>
      <text x="16" y="40" fill="#A8A29E">kurumlar arası veri paylaşımı</text>
    </g>

    <g transform="translate(820,486)">
      <rect width="320" height="90" rx="10" fill="#0F1B2D" stroke="#22D3EE" stroke-opacity="0.4"/>
      <text x="16" y="24" font-size="12.5" font-weight="700" fill="#7DD3FC">Tasarım İlkesi</text>
      <text x="16" y="46" fill="#94A3B8">Her değişiklik bir Event üretir.</text>
      <text x="16" y="64" fill="#94A3B8">AI yalnızca veritabanındaki</text>
      <text x="16" y="80" fill="#94A3B8">gerçek kayıtlara dayanır.</text>
    </g>
  </g>

  <!-- ===== connections ===== -->
  <g fill="none" stroke-width="1.8">
    <path d="M160 210 V278" stroke="#22D3EE" marker-end="url(#arwC)"/>
    <path d="M400 210 V278" stroke="#F59E0B" stroke-dasharray="5 4" marker-end="url(#arwA)"/>
    <path d="M620 210 V278" stroke="#F59E0B" stroke-dasharray="5 4" marker-end="url(#arwA)"/>
    <path d="M140 428 V498" stroke="#22D3EE" marker-end="url(#arwC)"/>
    <path d="M335 428 V498" stroke="#F59E0B" stroke-dasharray="5 4" marker-end="url(#arwA)"/>
    <path d="M505 428 V498" stroke="#F59E0B" stroke-dasharray="5 4" marker-end="url(#arwA)"/>
    <path d="M675 428 V498" stroke="#F59E0B" stroke-dasharray="5 4" marker-end="url(#arwA)"/>
    <path d="M395 602 V640" stroke="#A78BFA" stroke-dasharray="5 4" marker-end="url(#arw)"/>
    <path d="M800 460 H770 Q750 460 750 440 V430" stroke="#F59E0B" stroke-dasharray="5 4" marker-end="url(#arwA)"/>
  </g>
  <text x="172" y="252" font-size="10.5" fill="#7DD3FC">HTTP · WebSocket</text>
  <text x="152" y="470" font-size="10.5" fill="#7DD3FC">EF Core</text>
  <text x="410" y="628" font-size="10.5" fill="#8B8AA8">publish</text>
</svg>
